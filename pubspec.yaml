name: ma_1
description: "Pulse: Clinical Equipment Maintenance Platform powered by Pulse AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- STATE MANAGEMENT & PERSISTENCE ---
  provider: ^6.1.1
  shared_preferences: ^2.2.3

  # --- CORE UI & DATA ---
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.1
  intl: ^0.19.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.0

  # --- CLINICAL DESIGN & MOTION ---
  flutter_animate: ^4.5.0
  getwidget: ^7.0.1
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  
  # --- NOTIFICATIONS & PERMISSIONS ---
  flutter_local_notifications: ^17.1.1
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.5
  app_badge_plus: ^1.1.2
  workmanager: ^0.6.0 

  # --- AI ASSISTANT (Voice, Speech & Gemini) ---
  flutter_tts: ^3.8.5
  google_generative_ai: ^0.4.6
  speech_to_text:
    git:
      url: https://github.com/csdcorp/speech_to_text.git
      path: speech_to_text
  
  # --- ASSET SCANNING & GENERATION ---
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.0
  screenshot: ^2.1.0

  # --- COLLABORATION & COMMS ---
  socket_io_client: ^2.0.3 
  agora_rtc_engine: ^6.3.0
  flutter_sound: ^9.2.13
  emoji_picker_flutter: ^4.4.0 
  dart_jsonwebtoken: ^2.4.2

  # --- AUTHENTICATION & SECURITY ---
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  supabase_flutter: ^2.12.4
  sqflite_common_ffi_web: ^1.0.2
  local_auth: ^2.2.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.1
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0B2A5B"
    theme_color: "#0B2A5B"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/pulse_logo.png
    - assets/clinical_bg.png
    - assets/aeonmed_vg70.png
    - assets/drager_evita.png
    - assets/mindray_a5.png
    - assets/wato_ex35.png
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
