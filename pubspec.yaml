name: ma_1
description: "BioMed Tech Assistant App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core UI & Logic
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  
  # Cinematic HUD & Audio
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  
  # Background Tasks & System Alerts
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  app_badge_plus: ^1.1.2 # <-- THE NEW BADGE PACKAGE FIX
  
  # Forced to 'any' to bypass legacy v1 embedding bugs in older versions
  workmanager: any 
  
  # Pulling directly from GitHub with the specific subfolder path
  speech_to_text:
    git:
      url: https://github.com/csdcorp/speech_to_text.git
      path: speech_to_text
  
  # Additional Hardware Features
  image_picker: ^1.0.7
  flutter_tts: ^3.8.5

  # --- COMMS & QR PACKAGES ---
  socket_io_client: ^2.0.3     
  agora_rtc_engine: ^6.2.1     
  flutter_sound: ^9.2.13       
  cached_network_image: ^3.3.0 
  qr_flutter: ^4.1.0           
  mobile_scanner: ^5.0.0       
  screenshot: ^2.1.1           
  emoji_picker_flutter: ^4.4.0 

  # --- AUTH & SECURE STORAGE ---
  flutter_secure_storage: ^9.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon.png